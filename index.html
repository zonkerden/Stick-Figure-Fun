<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#fff7e6">
<title>Stick Figure Fun</title>
<style>
  :root{
    --ink:#33302e;
    --shadow: 0 3px 0 rgba(0,0,0,.10), 0 6px 16px rgba(0,0,0,.08);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;margin:0;overflow:hidden;}
  body{
    font-family:'Comic Sans MS','Chalkboard SE','Marker Felt','Segoe UI',system-ui,sans-serif;
    background:linear-gradient(165deg,#fff7e6 0%,#e8f6ff 55%,#ffe9f4 100%);
    display:flex;flex-direction:column;
    height:100dvh;
    color:var(--ink);
    user-select:none;-webkit-user-select:none;
    overscroll-behavior:none;
  }

  /* ---------- top bar ---------- */
  .topbar{
    flex:0 0 auto;
    display:flex;align-items:center;justify-content:space-between;
    padding:8px 12px;gap:8px;
  }
  .brand{
    font-size:clamp(14px,4.2vw,20px);font-weight:700;color:#5b4b8a;
    letter-spacing:.4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .top-actions{display:flex;gap:6px;flex:0 0 auto;}
  .icon-btn{
    width:42px;height:42px;border-radius:14px;border:none;background:#fff;
    box-shadow:var(--shadow);font-size:19px;cursor:pointer;
    display:grid;place-items:center;padding:0;line-height:1;
    transition:transform .12s ease, background .15s;
  }
  .icon-btn:active{transform:scale(.88);}
  .icon-btn.off{opacity:.4;}

  /* ---------- canvas stage ---------- */
  .stage{
    flex:1 1 auto;min-height:0;position:relative;
    margin:0 10px;border-radius:22px;
    background:#fffdf7;border:3px solid #fff;
    box-shadow:0 4px 0 rgba(0,0,0,.07), 0 10px 28px rgba(0,0,0,.09);
    overflow:hidden;
  }
  #board{position:absolute;inset:0;display:block;touch-action:none;cursor:crosshair;}
  .hint{
    position:absolute;left:50%;bottom:14px;transform:translateX(-50%);
    background:rgba(255,255,255,.92);padding:8px 16px;border-radius:20px;
    font-size:13px;color:#9a9186;pointer-events:none;white-space:nowrap;
    box-shadow:0 2px 10px rgba(0,0,0,.07);
    transition:opacity .4s ease;max-width:92%;overflow:hidden;text-overflow:ellipsis;
  }
  .hint.hide{opacity:0;}

  /* ---------- save toast ---------- */
  .toast{
    position:fixed;left:50%;top:50%;
    transform:translate(-50%,-50%) scale(.85);
    background:#5b4b8a;color:#fff;padding:14px 26px;border-radius:20px;
    font-size:18px;font-weight:700;letter-spacing:.3px;
    box-shadow:0 10px 30px rgba(0,0,0,.25);
    opacity:0;pointer-events:none;
    transition:opacity .25s ease, transform .25s cubic-bezier(.2,1.4,.5,1);
    z-index:999;
  }
  .toast.show{opacity:1;transform:translate(-50%,-50%) scale(1);}

  /* ---------- pose row ---------- */
  .pose-row{flex:0 0 auto;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;}
  .pose-row::-webkit-scrollbar{display:none;}
  .pose-inner{display:flex;gap:6px;padding:8px 10px;width:max-content;margin:0 auto;}
  .pose-btn{
    flex:0 0 auto;width:56px;height:58px;border-radius:16px;
    border:3px solid transparent;background:#fff;box-shadow:var(--shadow);
    cursor:pointer;padding:2px;display:grid;place-items:center;
    transition:transform .12s, border-color .15s, background .15s;
  }
  .pose-btn canvas{width:48px;height:48px;display:block;}
  .pose-btn.active{border-color:#ffb703;background:#fffbea;transform:translateY(-2px);}
  .pose-btn:active{transform:scale(.92);}

  /* ---------- toolbar ---------- */
  .toolbar{
    flex:0 0 auto;display:flex;flex-direction:column;gap:8px;
    padding:4px 10px calc(10px + env(safe-area-inset-bottom));
  }
  .row{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;}

  .tool{
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:1px;min-width:68px;padding:6px 10px;border-radius:16px;border:none;
    background:#fff;box-shadow:var(--shadow);cursor:pointer;
    font-family:inherit;color:#7a7268;
    transition:transform .12s, background .15s, color .15s;
  }
  .tool .emo{font-size:19px;line-height:1.1;}
  .tool span{font-size:10px;font-weight:700;letter-spacing:.3px;}
  .tool.active{background:#ffd166;color:#5b4b8a;transform:translateY(-2px);}
  .tool:active{transform:scale(.93);}

  .sizes{
    display:flex;gap:6px;align-items:center;
    padding-left:10px;margin-left:4px;border-left:2px dashed #e6ded1;
  }
  .size{
    width:38px;height:38px;border-radius:13px;border:none;background:#fff;
    box-shadow:var(--shadow);display:grid;place-items:center;cursor:pointer;
    transition:transform .12s, background .15s;padding:0;
  }
  .size i{display:block;border-radius:50%;background:#c9c2b8;transition:background .15s;}
  .size.active{background:#d6ecff;}
  .size.active i{background:#4361ee;}
  .size:active{transform:scale(.9);}

  .colors{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;}
  .swatch{
    width:34px;height:34px;border-radius:50%;border:3px solid #fff;padding:0;
    box-shadow:0 2px 7px rgba(0,0,0,.18);cursor:pointer;
    transition:transform .12s, box-shadow .15s;
  }
  .swatch.active{transform:scale(1.18);box-shadow:0 0 0 3px #ffb703,0 3px 10px rgba(0,0,0,.2);}
  .swatch:active{transform:scale(.9);}

  @media (max-height:560px){
    .brand{display:none;}
    .pose-btn{width:48px;height:50px;}
    .pose-btn canvas{width:42px;height:42px;}
  }
</style>
</head>
<body>

  <header class="topbar">
    <div class="brand">🖍️ Stick Figure Fun</div>
    <div class="top-actions">
      <button class="icon-btn" id="soundBtn" aria-label="Toggle sound">🔊</button>
      <button class="icon-btn" id="undoBtn"  aria-label="Undo">↩️</button>
      <button class="icon-btn" id="clearBtn" aria-label="Clear all">🗑️</button>
      <button class="icon-btn" id="saveBtn"  aria-label="Save picture as PNG">💾</button>
    </div>
  </header>

  <main class="stage" id="stage">
    <canvas id="board"></canvas>
    <div class="hint" id="hint">✏️ Draw with your finger — or tap 🧍 to stamp a person!</div>
  </main>

  <section class="pose-row" aria-label="Stick figure poses">
    <div class="pose-inner" id="poseRow"></div>
  </section>

  <footer class="toolbar">
    <div class="row">
      <button class="tool active" data-tool="draw">
        <span class="emo">✏️</span><span>DRAW</span>
      </button>
      <button class="tool" data-tool="figure">
        <span class="emo">🧍</span><span>PEOPLE</span>
      </button>
      <button class="tool" data-tool="erase">
        <span class="emo">🧽</span><span>ERASE</span>
      </button>
      <div class="sizes" id="sizeRow"></div>
    </div>
    <div class="row colors" id="colorRow"></div>
  </footer>

  <div class="toast" id="toast">Saved! 📸</div>

<script>
(() => {
'use strict';

/* =========================================================
   STICK FIGURE POSES
   Coordinates: origin (0,0) is the top of the head.
   Roughly 120 units tall, ±40 units wide.
   ========================================================= */
const POSES = [
  { name:'Wave',
    head:[0,16,15],
    body:[[0,31],[0,72]],
    limbs:[
      [[0,40],[-18,48],[-26,66]],
      [[0,40],[ 18,34],[ 27,12]],
      [[0,72],[-14,92],[-18,112]],
      [[0,72],[ 14,92],[ 18,112]]
    ]},

  { name:'Stand',
    head:[0,16,15],
    body:[[0,31],[0,72]],
    limbs:[
      [[0,40],[-20,50],[-27,68]],
      [[0,40],[ 20,50],[ 27,68]],
      [[0,72],[-16,92],[-18,112]],
      [[0,72],[ 16,92],[ 18,112]]
    ]},

  { name:'Dance',
    head:[0,16,15],
    body:[[0,31],[0,72]],
    limbs:[
      [[0,40],[-20,28],[-29, 6]],
      [[0,40],[ 20,28],[ 29, 6]],
      [[0,72],[-22,90],[-31,106]],
      [[0,72],[ 22,90],[ 31,106]]
    ]},

  { name:'Run',
    head:[0,16,15],
    body:[[0,31],[0,72]],
    limbs:[
      [[0,40],[-20,48],[-29,32]],
      [[0,40],[ 20,44],[ 31,60]],
      [[0,72],[-22,84],[-11,104]],
      [[0,72],[ 20,86],[ 33,100]]
    ]},

  { name:'Jump',
    head:[0,14,15],
    body:[[0,29],[0,70]],
    limbs:[
      [[0,38],[-20,25],[-33, 9]],
      [[0,38],[ 20,25],[ 33, 9]],
      [[0,70],[-20,86],[-35,93]],
      [[0,70],[ 20,86],[ 35,93]]
    ]},

  { name:'Sit',
    head:[0,14,15],
    body:[[0,29],[0,68]],
    limbs:[
      [[0,38],[-18,50],[-22,67]],
      [[0,38],[ 18,50],[ 22,67]],
      [[0,68],[ -2,88],[-27,90]],
      [[0,68],[  2,88],[ 27,90]]
    ]}
];

const COLORS = ['#e63946','#f77f00','#f9c74f','#2a9d8f','#4cc9f0',
                '#4361ee','#9b5de5','#f15bb5','#8d6e63','#2b2b2b'];
const SIZES = [5, 10, 18];

const PAPER = '#fffdf7';   // canvas background colour

/* =========================================================
   STATE
   ========================================================= */
const canvas = document.getElementById('board');
const ctx = canvas.getContext('2d');
const stage = document.getElementById('stage');
const hintEl = document.getElementById('hint');
const toastEl = document.getElementById('toast');

let W = 0, H = 0, DPR = 1;
let items = [];            // committed drawings
let current = null;        // path being drawn right now
let tool = 'draw';
let color = '#e63946';
let brushSize = 10;
let poseIndex = 0;
let soundOn = true;
let clearedBackup = null;

/* =========================================================
   SOUND (tiny WebAudio blips)
   ========================================================= */
let audioCtx = null;
function beep(freq, dur = 0.12, type = 'sine', vol = 0.10){
  if (!soundOn) return;
  try{
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const t = audioCtx.currentTime;
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, t);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(t); o.stop(t + dur + 0.03);
  }catch(_){ /* audio is a bonus, never a blocker */ }
}

/* =========================================================
   FIGURE PAINTING  (works on any 2D context)
   ========================================================= */
function paintFigure(c, pose, col, lw){
  c.strokeStyle = col;
  c.fillStyle   = col;
  c.lineCap = 'round';
  c.lineJoin = 'round';

  // limbs
  c.lineWidth = lw;
  for (const limb of pose.limbs){
    c.beginPath();
    c.moveTo(limb[0][0], limb[0][1]);
    for (let i = 1; i < limb.length; i++) c.lineTo(limb[i][0], limb[i][1]);
    c.stroke();
  }
  // body
  c.beginPath();
  c.moveTo(pose.body[0][0], pose.body[0][1]);
  c.lineTo(pose.body[1][0], pose.body[1][1]);
  c.stroke();
  // head
  const [hx, hy, hr] = pose.head;
  c.beginPath();
  c.arc(hx, hy, hr, 0, Math.PI * 2);
  c.stroke();

  // face :)
  c.lineWidth = Math.max(1, lw * 0.55);
  const er = hr * 0.14;
  c.beginPath(); c.arc(hx - hr*0.36, hy - hr*0.14, er, 0, Math.PI*2); c.fill();
  c.beginPath(); c.arc(hx + hr*0.36, hy - hr*0.14, er, 0, Math.PI*2); c.fill();
  c.beginPath();
  c.arc(hx, hy + hr*0.06, hr*0.46, Math.PI*0.18, Math.PI*0.82);
  c.stroke();
}

/* =========================================================
   RENDER  (all drawing helpers take a context)
   ========================================================= */
let scheduled = false;
function requestRender(){
  if (scheduled) return;
  scheduled = true;
  requestAnimationFrame(() => { scheduled = false; render(); });
}

function render(){
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.fillStyle = PAPER;
  ctx.fillRect(0, 0, W, H);

  for (const it of items) drawItem(ctx, it);
  if (current) drawItem(ctx, current);

  hintEl.classList.toggle('hide', items.length > 0 || !!current);
}

function drawItem(c, it){
  if (it.type === 'path')        strokePath(c, it.points, it.color, it.width);
  else if (it.type === 'figure') drawFigure(c, it);
}

function strokePath(c, pts, col, width){
  c.strokeStyle = col;
  c.fillStyle = col;
  c.lineCap = 'round';
  c.lineJoin = 'round';
  c.lineWidth = width;

  if (pts.length === 1){
    c.beginPath();
    c.arc(pts[0].x, pts[0].y, width / 2, 0, Math.PI * 2);
    c.fill();
    return;
  }
  c.beginPath();
  c.moveTo(pts[0].x, pts[0].y);
  if (pts.length === 2){
    c.lineTo(pts[1].x, pts[1].y);
  } else {
    for (let i = 1; i < pts.length - 1; i++){
      const mx = (pts[i].x + pts[i+1].x) / 2;
      const my = (pts[i].y + pts[i+1].y) / 2;
      c.quadraticCurveTo(pts[i].x, pts[i].y, mx, my);
    }
    const last = pts[pts.length - 1];
    c.lineTo(last.x, last.y);
  }
  c.stroke();
}

function drawFigure(c, f){
  c.save();
  c.translate(f.x, f.y);
  c.scale(f.scale, f.scale);
  paintFigure(c, POSES[f.pose], f.color, 6.5);
  c.restore();
}

/* =========================================================
   HIT TESTING
   ========================================================= */
function distToSeg(p, a, b){
  const dx = b.x - a.x, dy = b.y - a.y;
  const len2 = dx*dx + dy*dy;
  let t = len2 ? ((p.x - a.x)*dx + (p.y - a.y)*dy) / len2 : 0;
  t = Math.max(0, Math.min(1, t));
  return Math.hypot(p.x - (a.x + t*dx), p.y - (a.y + t*dy));
}

function hitItem(p){
  for (let i = items.length - 1; i >= 0; i--){
    const it = items[i];
    if (it.type === 'figure'){
      const s = it.scale;
      const lx = (p.x - it.x) / s;
      const ly = (p.y - it.y) / s;
      if (lx > -44 && lx < 44 && ly > -16 && ly < 128) return it;
    } else {
      const pts = it.points;
      const tol = it.width / 2 + 10;
      if (pts.length === 1){
        if (Math.hypot(p.x - pts[0].x, p.y - pts[0].y) < tol) return it;
      }
      for (let j = 1; j < pts.length; j++){
        if (distToSeg(p, pts[j-1], pts[j]) < tol) return it;
      }
    }
  }
  return null;
}

function hitFigure(p){
  for (let i = items.length - 1; i >= 0; i--){
    const it = items[i];
    if (it.type !== 'figure') continue;
    const s = it.scale;
    const lx = (p.x - it.x) / s;
    const ly = (p.y - it.y) / s;
    if (lx > -44 && lx < 44 && ly > -16 && ly < 128) return it;
  }
  return null;
}

/* =========================================================
   POINTER INTERACTION
   ========================================================= */
let mode = null;               // 'draw' | 'drag' | 'erase'
let dragTarget = null;
let dragOff = { x:0, y:0 };

function getPos(e){
  const r = canvas.getBoundingClientRect();
  return { x: e.clientX - r.left, y: e.clientY - r.top };
}

canvas.addEventListener('pointerdown', e => {
  if (!e.isPrimary) return;
  e.preventDefault();
  try { canvas.setPointerCapture(e.pointerId); } catch(_){}
  const p = getPos(e);

  if (tool === 'draw'){
    mode = 'draw';
    current = { type:'path', color, width: brushSize, points:[p] };
    requestRender();

  } else if (tool === 'figure'){
    const existing = hitFigure(p);
    if (existing){
      mode = 'drag';
      dragTarget = existing;
      dragOff = { x: p.x - existing.x, y: p.y - existing.y };
    } else {
      clearedBackup = null;
      const fig = { type:'figure', x:p.x, y:p.y, pose:poseIndex, color, scale:1.15 };
      items.push(fig);
      mode = 'drag';
      dragTarget = fig;
      dragOff = { x:0, y:0 };
      beep(520 + Math.random()*200, 0.12, 'sine', 0.09);
    }
    requestRender();

  } else if (tool === 'erase'){
    mode = 'erase';
    eraseAt(p);
  }
});

canvas.addEventListener('pointermove', e => {
  if (!mode || !e.isPrimary) return;
  e.preventDefault();
  const p = getPos(e);

  if (mode === 'draw' && current){
    const last = current.points[current.points.length - 1];
    if (Math.hypot(p.x - last.x, p.y - last.y) > 1.6){
      current.points.push(p);
      requestRender();
    }
  } else if (mode === 'drag' && dragTarget){
    dragTarget.x = p.x - dragOff.x;
    dragTarget.y = p.y - dragOff.y;
    requestRender();
  } else if (mode === 'erase'){
    eraseAt(p);
  }
});

function endPointer(){
  if (mode === 'draw' && current){
    items.push(current);
    current = null;
  }
  mode = null;
  dragTarget = null;
  requestRender();
}
canvas.addEventListener('pointerup', endPointer);
canvas.addEventListener('pointercancel', endPointer);
canvas.addEventListener('pointerleave', e => { if (mode === 'draw') endPointer(); });

function eraseAt(p){
  const it = hitItem(p);
  if (it){
    items.splice(items.indexOf(it), 1);
    beep(230, 0.06, 'triangle', 0.06);
    requestRender();
  }
}

/* =========================================================
   RESIZE
   ========================================================= */
function resize(){
  const r = stage.getBoundingClientRect();
  const w = Math.max(1, Math.round(r.width));
  const h = Math.max(1, Math.round(r.height));
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = w; H = h;
  canvas.width  = Math.round(w * DPR);
  canvas.height = Math.round(h * DPR);
  canvas.style.width  = w + 'px';
  canvas.style.height = h + 'px';
  render();
}
new ResizeObserver(resize).observe(stage);

/* =========================================================
   ★★★  SAVE AS PNG  ★★★
   Renders the artwork onto a fresh, high-resolution canvas
   (2× the on-screen size) and downloads it as a PNG file.
   ========================================================= */
const EXPORT_SCALE = 2;         // 2× = crisp image for sharing / printing

function buildExportCanvas(){
  const out = document.createElement('canvas');
  out.width  = Math.max(1, Math.round(W * EXPORT_SCALE));
  out.height = Math.max(1, Math.round(H * EXPORT_SCALE));

  const c = out.getContext('2d');
  c.setTransform(EXPORT_SCALE, 0, 0, EXPORT_SCALE, 0, 0);

  // solid paper background (PNG would otherwise be transparent)
  c.fillStyle = PAPER;
  c.fillRect(0, 0, W, H);

  // draw every committed item
  for (const it of items) drawItem(c, it);

  return out;
}

function showToast(msg){
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => toastEl.classList.remove('show'), 1600);
}

function savePNG(){
  // nothing to save? still export a blank page — but gently warn first.
  if (!items.length){
    showToast('Draw something first! ✏️');
    beep(300, 0.15, 'triangle', 0.07);
    return;
  }

  let out;
  try {
    out = buildExportCanvas();
  } catch(err){
    showToast('Oops, could not save 😕');
    return;
  }

  const filename = 'stick-figures-' +
    new Date().toISOString().slice(0,10) + '.png';

  // Preferred path: toBlob + object URL (works on modern mobile & desktop)
  if (out.toBlob){
    out.toBlob(blob => {
      if (!blob){ fallbackDataURL(out, filename); return; }
      const url = URL.createObjectURL(blob);
      triggerDownload(url, filename, true);
      beep(920, 0.12, 'sine', 0.08);
      showToast('Saved! 📸');
    }, 'image/png');
  } else {
    fallbackDataURL(out, filename);
  }
}

function fallbackDataURL(out, filename){
  try {
    const url = out.toDataURL('image/png');
    triggerDownload(url, filename, false);
    beep(920, 0.12, 'sine', 0.08);
    showToast('Saved! 📸');
  } catch(err){
    showToast('Oops, could not save 😕');
  }
}

function triggerDownload(url, filename, revoke){
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  a.rel = 'noopener';
  a.style.display = 'none';
  document.body.appendChild(a);
  a.click();

  // iOS Safari sometimes needs a tick before cleanup
  setTimeout(() => {
    document.body.removeChild(a);
    if (revoke) URL.revokeObjectURL(url);
  }, 1500);
}

document.getElementById('saveBtn').addEventListener('click', savePNG);

/* =========================================================
   UI BUILDING
   ========================================================= */
// ---- poses ----
const poseRow = document.getElementById('poseRow');
const poseCanvases = [];

POSES.forEach((pose, i) => {
  const btn = document.createElement('button');
  btn.className = 'pose-btn' + (i === 0 ? ' active' : '');
  btn.type = 'button';
  btn.setAttribute('aria-label', pose.name);

  const cv = document.createElement('canvas');
  cv.width = 96; cv.height = 96;   // 2x for crispness
  btn.appendChild(cv);

  btn.addEventListener('click', () => {
    poseIndex = i;
    setTool('figure');
    [...poseRow.children].forEach((b, j) => b.classList.toggle('active', j === i));
    beep(660 + i * 40, 0.08, 'sine', 0.07);
    renderPosePreviews();
  });

  poseRow.appendChild(btn);
  poseCanvases.push(cv);
});

function renderPosePreviews(){
  poseCanvases.forEach((cv, i) => {
    const c = cv.getContext('2d');
    c.setTransform(1, 0, 0, 1, 0, 0);
    c.clearRect(0, 0, cv.width, cv.height);
    c.setTransform(2, 0, 0, 2, 0, 0);       // dpr 2
    c.translate(24, 26);
    c.scale(0.36, 0.36);
    c.translate(0, -62);
    paintFigure(c, POSES[i], i === poseIndex ? color : '#b9b1a6', 7);
  });
}

// ---- tools ----
const toolButtons = [...document.querySelectorAll('.tool')];
toolButtons.forEach(btn => {
  btn.addEventListener('click', () => setTool(btn.dataset.tool));
});

function setTool(t){
  tool = t;
  toolButtons.forEach(b => b.classList.toggle('active', b.dataset.tool === t));
  canvas.style.cursor = t === 'erase' ? 'cell' : 'crosshair';
}

// ---- sizes ----
const sizeRow = document.getElementById('sizeRow');
SIZES.forEach((s, i) => {
  const b = document.createElement('button');
  b.className = 'size' + (s === brushSize ? ' active' : '');
  b.type = 'button';
  b.setAttribute('aria-label', 'Brush size ' + (i + 1));
  const dot = document.createElement('i');
  const d = 6 + i * 6;
  dot.style.width = d + 'px';
  dot.style.height = d + 'px';
  b.appendChild(dot);
  b.addEventListener('click', () => {
    brushSize = s;
    [...sizeRow.children].forEach((x, j) => x.classList.toggle('active', j === i));
    beep(700, 0.05, 'sine', 0.05);
  });
  sizeRow.appendChild(b);
});

// ---- colors ----
const colorRow = document.getElementById('colorRow');
COLORS.forEach((c, i) => {
  const b = document.createElement('button');
  b.className = 'swatch' + (c === color ? ' active' : '');
  b.type = 'button';
  b.style.background = c;
  b.setAttribute('aria-label', 'Color ' + (i + 1));
  b.addEventListener('click', () => {
    color = c;
    [...colorRow.children].forEach((x, j) => x.classList.toggle('active', j === i));
    renderPosePreviews();
    beep(880, 0.05, 'sine', 0.05);
  });
  colorRow.appendChild(b);
});

/* =========================================================
   TOP BAR ACTIONS
   ========================================================= */
document.getElementById('undoBtn').addEventListener('click', () => {
  if (items.length){
    items.pop();
    beep(360, 0.08, 'triangle', 0.07);
  } else if (clearedBackup){
    items = clearedBackup;
    clearedBackup = null;
    beep(500, 0.1, 'sine', 0.08);
  }
  requestRender();
});

document.getElementById('clearBtn').addEventListener('click', () => {
  if (!items.length && !current) return;
  clearedBackup = items;
  items = [];
  current = null;
  beep(280, 0.22, 'sawtooth', 0.06);
  requestRender();
});

const soundBtn = document.getElementById('soundBtn');
soundBtn.addEventListener('click', () => {
  soundOn = !soundOn;
  soundBtn.textContent = soundOn ? '🔊' : '🔇';
  soundBtn.classList.toggle('off', !soundOn);
  if (soundOn) beep(760, 0.08, 'sine', 0.08);
});

/* =========================================================
   GO!
   ========================================================= */
renderPosePreviews();
resize();
setTool('draw');

// Keyboard shortcuts for desktop fun
window.addEventListener('keydown', e => {
  if (e.key === 'z' && (e.metaKey || e.ctrlKey)){ e.preventDefault(); document.getElementById('undoBtn').click(); }
  if (e.key === 's' && (e.metaKey || e.ctrlKey)){ e.preventDefault(); savePNG(); }
  if (e.key === '1') setTool('draw');
  if (e.key === '2') setTool('figure');
  if (e.key === '3') setTool('erase');
});

})();
</script>
</body>
</html>
